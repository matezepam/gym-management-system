<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Membresías</title><link rel="stylesheet" href="/css/styles.css"></head><body><div class="layout"><aside><div class="logo">GYM<span>CONTROL</span></div><a href="/admin/dashboard">Dashboard</a><a href="/admin/clientes">Clientes</a><a class="active" href="/admin/membresias">Membresías</a><a href="/admin/asistencias">Asistencias</a><a href="/admin/pagos">Pagos</a></aside><main><h1>Membresías</h1><div class="grid2"><section class="panel"><h2>Crear tipo</h2><form method="post" action="/admin/membresias/tipo"><label>Nombre</label><input name="nombre" required><label>Precio</label><input type="number" step="0.01" name="precio" required><label>Duración en días</label><input type="number" name="duracionDias" required><button>Crear membresía</button></form></section><section class="panel"><h2>Asignar a cliente</h2><form method="post" action="/admin/membresias/asignar"><label>Cliente</label><select name="clienteId" required><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option></select><label>Tipo</label><select name="tipoId" required><option th:each="t:${tipos}" th:value="${t.id}" th:text="${t.nombre+' - $'+t.precio}"></option></select><label>Fecha de inicio</label><input type="date" name="fechaInicio" required><button>Asignar membresía</button></form></section></div><section class="panel"><h2>Membresías asignadas</h2><table><thead><tr><th>Cliente</th><th>Plan</th><th>Inicio</th><th>Vencimiento</th></tr></thead><tbody><tr th:each="m:${asignadas}"><td th:text="${m.cliente.nombre}"></td><td th:text="${m.membresia.nombre}"></td><td th:text="${m.fechaInicio}"></td><td th:text="${m.fechaVencimiento}"></td></tr></tbody></table></section></main></div></body></html>
