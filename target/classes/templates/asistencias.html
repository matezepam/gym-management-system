<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asistencias</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="layout">

    <aside>
        <div class="logo">GYM<span>CONTROL</span></div>

        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/clientes}">Clientes</a>
        <a th:href="@{/admin/membresias}">Membresías</a>
        <a class="active" th:href="@{/admin/asistencias}">Asistencias</a>
        <a th:href="@{/admin/pagos}">Pagos</a>

        <form method="post" th:action="@{/logout}">
            <button class="logout" type="submit">Cerrar sesión</button>
        </form>
    </aside>

    <main>

        <h1>Control de asistencia</h1>

        <div class="alert ok"
             th:if="${ok}"
             th:text="${ok}">
        </div>

        <div class="alert error"
             th:if="${error}"
             th:text="${error}">
        </div>

        <section class="panel">

            <h2>Registrar entrada</h2>

            <form method="post"
                  th:action="@{/admin/asistencias/registrar}"
                  class="inline-form">

                <select name="clienteId" required>
                    <option th:each="c : ${clientes}"
                            th:value="${c.id}"
                            th:text="${c.nombre + ' - ' + c.cedula}">
                    </option>
                </select>

                <button type="submit">
                    Registrar entrada
                </button>

            </form>

            <p class="muted">
                El sistema bloquea automáticamente la entrada si la membresía está vencida.
            </p>

        </section>

        <section class="panel">

            <h2>Historial</h2>

            <table>
                <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Fecha y hora</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="a : ${asistencias}">
                    <td th:text="${a.cliente.nombre}"></td>

                    <td th:text="${#temporals.format(a.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
                </tr>

                </tbody>
            </table>

        </section>

    </main>

</div>

</body>
</html>
