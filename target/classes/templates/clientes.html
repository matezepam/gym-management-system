<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="layout">

    <aside>

        <div class="logo">GYM<span>CONTROL</span></div>

        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a class="active" th:href="@{/admin/clientes}">Clientes</a>
        <a th:href="@{/admin/membresias}">Membresías</a>
        <a th:href="@{/admin/asistencias}">Asistencias</a>
        <a th:href="@{/admin/pagos}">Pagos</a>

        <form method="post" th:action="@{/logout}">
            <button class="logout" type="submit">
                Cerrar sesión
            </button>
        </form>

    </aside>

    <main>

        <div class="top">

            <div>
                <h1>Clientes</h1>
                <p>Registro y administración</p>
            </div>

            <a class="btn"
               th:href="@{/admin/clientes/nuevo}">
                + Nuevo cliente
            </a>

        </div>

        <form class="search"
              method="get"
              th:action="@{/admin/clientes}">

            <input name="q"
                   th:value="${q}"
                   placeholder="Buscar por nombre o cédula">

            <button type="submit">
                Buscar
            </button>

        </form>

        <section class="panel">

            <table>

                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="c : ${clientes}">

                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.cedula}"></td>
                    <td th:text="${c.telefono}"></td>
                    <td th:text="${c.email}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${c.activo} ? ' good' : ' bad'"
                              th:text="${c.activo} ? 'Activo' : 'Inactivo'">
                        </span>
                    </td>

                    <td class="actions">

                        <a th:href="@{/admin/clientes/{id}/editar(id=${c.id})}">
                            Editar
                        </a>

                        <form method="post"
                              th:action="@{/admin/clientes/{id}/estado(id=${c.id})}">

                            <button type="submit"
                                    th:text="${c.activo} ? 'Desactivar' : 'Activar'">
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

</body>
</html>
