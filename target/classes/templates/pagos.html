<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pagos</title>

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>

<body>

<div class="layout">

    <aside>

        <div class="logo">
            GYM<span>CONTROL</span>
        </div>

        <a th:href="@{/admin/dashboard}">
            Dashboard
        </a>

        <a th:href="@{/admin/clientes}">
            Clientes
        </a>

        <a th:href="@{/admin/membresias}">
            Membresías
        </a>

        <a th:href="@{/admin/asistencias}">
            Asistencias
        </a>

        <a class="active"
           th:href="@{/admin/pagos}">
            Pagos
        </a>

        <form method="post"
              th:action="@{/logout}">

            <button class="logout"
                    type="submit">
                Cerrar sesión
            </button>

        </form>

    </aside>

    <main>

        <h1>Pagos</h1>

        <section class="panel">

            <h2>Registrar pago</h2>

            <form class="inline-form"
                  method="post"
                  th:action="@{/admin/pagos}">

                <select name="clienteId"
                        required>

                    <option th:each="c : ${clientes}"
                            th:value="${c.id}"
                            th:text="${c.nombre}">
                    </option>

                </select>

                <input type="number"
                       step="0.01"
                       name="monto"
                       placeholder="Monto"
                       required>

                <input name="descripcion"
                       placeholder="Descripción"
                       required>

                <button type="submit">
                    Registrar pago
                </button>

            </form>

        </section>

        <section class="panel">

            <h2>Historial de pagos</h2>

            <table>

                <thead>

                <tr>
                    <th>Cliente</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                    <th>Descripción</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="p : ${pagos}">

                    <td th:text="${p.cliente.nombre}"></td>

                    <td th:text="${'$' + p.monto}"></td>

                    <td th:text="${p.fechaPago}"></td>

                    <td th:text="${p.descripcion}"></td>

                </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

</body>
</html>
