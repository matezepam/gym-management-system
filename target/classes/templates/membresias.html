<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Membresías | Gym Control</title>

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">

</head>

<body>

<div class="layout">

    <aside>

        <div class="logo">
            GYM<span>CONTROL</span>
        </div>

        <a th:href="@{/admin/dashboard}">
            Dashboard
        </a>

        <a th:href="@{/admin/clientes}">
            Clientes
        </a>

        <a class="active"
           th:href="@{/admin/membresias}">
            Membresías
        </a>

        <a th:href="@{/admin/asistencias}">
            Asistencias
        </a>

        <a th:href="@{/admin/pagos}">
            Pagos
        </a>

        <form method="post"
              th:action="@{/logout}">

            <button class="logout"
                    type="submit">
                Cerrar sesión
            </button>

        </form>

    </aside>


    <main>

        <div class="top">

            <div>

                <h1>Membresías</h1>

                <p>
                    Administración de planes y membresías
                    de clientes
                </p>

            </div>

        </div>


        <!-- MENSAJES -->

        <div class="alert ok"
             th:if="${ok}"
             th:text="${ok}">
        </div>

        <div class="alert error"
             th:if="${error}"
             th:text="${error}">
        </div>


        <div class="grid2">


            <!-- CREAR TIPO -->

            <section class="panel">

                <h2>Crear tipo de membresía</h2>

                <form method="post"
                      th:action="@{/admin/membresias/tipo}">

                    <label>
                        Nombre del plan
                    </label>

                    <input
                            type="text"
                            name="nombre"
                            placeholder="Ej: Premium"
                            required
                    >


                    <label>
                        Precio
                    </label>

                    <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="precio"
                            placeholder="25.00"
                            required
                    >


                    <label>
                        Duración en días
                    </label>

                    <input
                            type="number"
                            min="1"
                            name="duracionDias"
                            placeholder="30"
                            required
                    >


                    <button type="submit">
                        Crear membresía
                    </button>

                </form>

            </section>


            <!-- ASIGNAR -->

            <section class="panel">

                <h2>Asignar membresía</h2>

                <form method="post"
                      th:action="@{/admin/membresias/asignar}">


                    <label>
                        Cliente
                    </label>

                    <select
                            name="clienteId"
                            required>

                        <option value=""
                                disabled
                                selected>
                            Seleccione un cliente
                        </option>

                        <option
                                th:each="c : ${clientes}"
                                th:value="${c.id}"
                                th:text="${c.nombre}">
                        </option>

                    </select>


                    <label>
                        Tipo de membresía
                    </label>

                    <select
                            name="tipoId"
                            required>

                        <option value=""
                                disabled
                                selected>
                            Seleccione un plan
                        </option>

                        <option
                                th:each="t : ${tipos}"
                                th:value="${t.id}"
                                th:text="${t.nombre + ' - $' + t.precio}">
                        </option>

                    </select>


                    <label>
                        Fecha de inicio
                    </label>

                    <input
                            type="date"
                            name="fechaInicio"
                            required
                    >


                    <button type="submit">
                        Asignar membresía
                    </button>

                </form>

            </section>

        </div>


        <!-- TIPOS EXISTENTES -->

        <section class="panel">

            <h2>Tipos de membresía</h2>

            <table>

                <thead>

                <tr>
                    <th>Plan</th>
                    <th>Precio</th>
                    <th>Duración</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="t : ${tipos}">

                    <td th:text="${t.nombre}">
                    </td>

                    <td th:text="${'$' + t.precio}">
                    </td>

                    <td th:text="${t.duracionDias + ' días'}">
                    </td>

                </tr>

                </tbody>

            </table>

        </section>


        <!-- MEMBRESÍAS ASIGNADAS -->

        <section class="panel">

            <h2>
                Membresías asignadas
            </h2>

            <table>

                <thead>

                <tr>

                    <th>Cliente</th>
                    <th>Plan</th>
                    <th>Fecha de inicio</th>
                    <th>Fecha de vencimiento</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="m : ${asignadas}">

                    <td th:text="${m.cliente.nombre}">
                    </td>

                    <td th:text="${m.membresia.nombre}">
                    </td>

                    <td th:text="${m.fechaInicio}">
                    </td>

                    <td th:text="${m.fechaVencimiento}">
                    </td>

                </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

</body>

</html>
