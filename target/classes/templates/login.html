<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Control | Login</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="login-bg">

<div class="login-card">

    <div class="logo">
        GYM<span>CONTROL</span>
    </div>

    <h1>Bienvenido</h1>

    <p>Ingresa al sistema de gestión</p>

    <!-- Mensaje cuando las credenciales son incorrectas -->
    <div class="alert error" th:if="${param.error}">
        Usuario o contraseña incorrectos.
    </div>

    <!-- Mensaje cuando el usuario cierra sesión -->
    <div class="alert ok" th:if="${param.logout}">
        Sesión cerrada correctamente.
    </div>

    <!-- Login -->
    <form method="post" th:action="@{/login}">

        <label for="username">
            Usuario
        </label>

        <input
                id="username"
                type="text"
                name="username"
                placeholder="Usuario"
                autocomplete="username"
                required
        >

        <label for="password">
            Contraseña
        </label>

        <input
                id="password"
                type="password"
                name="password"
                placeholder="Contraseña"
                autocomplete="current-password"
                required
        >

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <div class="demo">
        <strong>Administrador:</strong>
        admin / Admin123*
        <br>

        <strong>Cliente:</strong>
        cliente / Cliente123*
    </div>

</div>

</body>
</html>
